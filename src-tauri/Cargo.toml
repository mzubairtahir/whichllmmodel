[package]
name = "whichllmmodel"
version = "1.0.0"
description = "whichllmmodel - Zero-Download Hardware Simulator Desktop App"
authors = ["whichllmmodel"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "5"
ureq = { version = "2", features = ["json"] }
winreg = "0.52"

# The bandwidth benchmark and GGUF parsing are CPU-bound loops; keep dev builds fast enough to be representative.
[profile.dev]
opt-level = 2
